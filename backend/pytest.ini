[pytest]
# python -m pytest            (from backend/; see tests/README.md)
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    postgres: needs PostgreSQL with pgvector (set TEST_DATABASE_URL), skipped otherwise
filterwarnings =
    ignore::DeprecationWarning:botocore.*
    ignore::DeprecationWarning:google.*
