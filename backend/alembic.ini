# Alembic: database schema migrations (doc 21). The database URL comes from backend/.env (DATABASE_URL),
# never from this file, so no password is ever committed.
#   alembic upgrade head            apply every migration (the app also does this at startup: DB_AUTO_MIGRATE)
#   alembic revision --autogenerate -m "add x"    write a new migration from the model changes, then REVIEW it
#   alembic current / history       where the database is / what exists
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
